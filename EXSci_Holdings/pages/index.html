
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExSci Holdings | Exercise Science. Easier.</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header class="site-header">
        <div class="container header-content">
            <a href="index.html" class="logo">ExSci <span>Holdings</span></a>
            <p>Exercise Science. Easier.</p>
        </div>
    </header>

    <main class="container">
        <section class="page-heading">
            <h1>Welcome to ExSci</h1>
            <p>Your exercise-science calculators, made easier to understand.</p>
        </section>

        <section class="calculator-card form-card">
            <h2>Tell us about yourself</h2>
            <p>Enter your details to personalise your calculations.</p>

            <form id="details-form">

                <div class="form-group">
                    <label for="age">Age (years)</label>
                    <input type="number" id="age" min="18" max="120"
                           placeholder="e.g. 27" required>
                </div>

                <div class="form-group">
                    <label for="sex">Sex used for the calculation</label>
                    <select id="sex" required>
                        <option value="">Select an option</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                    <p class="field-note">
                        Some equations use sex-specific constants.
                    </p>
                </div>

                <div class="form-group">
                    <label for="height">Height (cm)</label>
                    <input type="number" id="height" min="50" max="250"
                           step="0.1" placeholder="e.g. 175" required>
                </div>

                <div class="form-group">
                    <label for="weight">Weight (kg)</label>
                    <input type="number" id="weight" min="10" max="500"
                           step="0.1" placeholder="e.g. 70" required>
                </div>

                <div class="form-group">
                    <label for="resting-heart-rate">Resting heart rate (bpm)</label>
                    <input type="number" id="resting-heart-rate"
                           min="25" max="250" placeholder="Optional">
                </div>

                <div class="form-group">
                    <label for="activity-level">Activity level</label>
                    <select id="activity-level" required>
                        <option value="">Select your activity level</option>
                        <option value="sedentary">
                            Sedentary: little planned exercise
                        </option>
                        <option value="lightly_active">
                            Lightly active: light exercise 1–3 days/week
                        </option>
                        <option value="moderately_active">
                            Moderately active: moderate exercise 3–5 days/week
                        </option>
                        <option value="very_active">
                            Very active: hard exercise 6–7 days/week
                        </option>
                        <option value="extra_active">
                            Extra active: very demanding training or physical work
                        </option>
                    </select>
                </div>

                <button type="submit" class="primary-button">
                    Continue to Calculators
                </button>

            </form>
        </section>
    </main>

    <footer class="site-footer">
        <p>ExSci Holdings Ltd | Exercise Science. Easier.</p>
    </footer>

    <script src="../js/script.js"></script>
</body>
</html>
